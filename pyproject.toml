[project]
name = "tfg-generador-examenes"
version = "0.1.0"
description = "Herramienta para la generación automática de exámenes a partir de repositorios de código fuente con LLMs"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Damián García López", email = "dgl44@alu.ua.es" }
]
dependencies = [
    "boto3>=1.40",
    "crewai>=1.14.4",
    "fpdf2>=2.8.7",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.58.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
